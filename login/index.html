<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — YesCart</title>
  <meta name="description" content="Login to your YesCart account.">

  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      background: linear-gradient(135deg, #f6f8fb, #e7ecf2);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 15px 60px rgba(7,26,53,.12);
      border: 1px solid #e7ebf0;
    }

    .logo-center {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-center .logo {
      display: inline-block;
      font-size: 32px;
    }

    .auth-card h1 {
      color: #071a35;
      font-size: 28px;
      margin: 20px 0 8px;
      text-align: center;
    }

    .auth-intro {
      color: #667085;
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #172033;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      border: 1px solid #dfe4ea;
      border-radius: 11px;
      padding: 13px 14px;
      outline: none;
      font: inherit;
      transition: .2s;
    }

    .form-group input:focus {
      border-color: #ff7a00;
      box-shadow: 0 0 0 3px rgba(255,122,0,.08);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .remember-forgot a {
      color: #ff7a00;
      font-weight: 700;
    }

    .login-btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      color: #667085;
      font-size: 13px;
    }

    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .social-btn {
      border: 1px solid #dfe4ea;
      background: white;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: .2s;
    }

    .social-btn:hover {
      border-color: #ff7a00;
      color: #ff7a00;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #667085;
    }

    .auth-footer a {
      color: #ff7a00;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo-center">
      <a href="/" class="logo"><span>Yes</span>Cart</a>
    </div>

    <h1>Welcome Back</h1>
    <p class="auth-intro">Login to your YesCart account</p>

    <form>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="remember-forgot">
        <label>
          <input type="checkbox" style="margin-right: 5px;">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn primary login-btn">LOGIN</button>
    </form>

    <div class="divider">OR</div>

    <div class="social-login">
      <button class="social-btn">Google</button>
      <button class="social-btn">Facebook</button>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Sign up here</a>
    </div>
  </div>
</div>

<script src="../script.js"></script>
</body>
</html>
