<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up — YesCart</title>
  <meta name="description" content="Create your YesCart account.">

  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      background: linear-gradient(135deg, #f6f8fb, #e7ecf2);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 15px 60px rgba(7,26,53,.12);
      border: 1px solid #e7ebf0;
    }

    .logo-center {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-center .logo {
      display: inline-block;
      font-size: 32px;
    }

    .auth-card h1 {
      color: #071a35;
      font-size: 28px;
      margin: 20px 0 8px;
      text-align: center;
    }

    .auth-intro {
      color: #667085;
      font-size: 14px;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #172033;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      border: 1px solid #dfe4ea;
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      font: inherit;
      transition: .2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #ff7a00;
      box-shadow: 0 0 0 3px rgba(255,122,0,.08);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #667085;
      margin-bottom: 20px;
    }

    .checkbox-group a {
      color: #ff7a00;
      font-weight: 700;
    }

    .signup-btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #667085;
    }

    .auth-footer a {
      color: #ff7a00;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo-center">
      <a href="/" class="logo"><span>Yes</span>Cart</a>
    </div>

    <h1>Create Account</h1>
    <p class="auth-intro">Join YesCart today</p>

    <form>
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Last name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit number" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
      </div>

      <div class="form-group">
        <label for="accountType">I want to</label>
        <select id="accountType" required>
          <option value="">Select your purpose</option>
          <option>Buy products</option>
          <option>Sell products</option>
          <option>Explore opportunities</option>
          <option>All of the above</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms" style="margin: 0;">
          I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn primary signup-btn">CREATE ACCOUNT</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Login here</a>
    </div>
  </div>
</div>

<script src="../script.js"></script>
</body>
</html>
